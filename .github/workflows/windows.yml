name: Windows-app bouwen

on:
  workflow_dispatch:      # knop "Run workflow" op GitHub
  push:
    branches: [main, master]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: App bouwen
        shell: bash
        run: bash packaging/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Reeksoptimalisatie-Windows
          path: build/app/Reeksoptimalisatie
